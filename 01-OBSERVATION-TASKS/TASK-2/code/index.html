<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile Generator</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f2f4f8; }
  #showProfileBtn { background: #2f6fed; color: #fff; border: none; padding: 12px 28px;
                     font-size: 16px; border-radius: 6px; cursor: pointer; }
  #showProfileBtn:hover { background: #1e54c4; }
  .profile-card { margin: 30px auto 0; background: #fff; border-radius: 10px;
                   box-shadow: 0 4px 14px rgba(0,0,0,0.12); padding: 25px 35px;
                   width: 300px; text-align: left; }
  .profile-card h2 { color: #2f6fed; border-bottom: 2px solid #2f6fed; padding-bottom: 8px; }
  .profile-card span.label { font-weight: 600; display: inline-block; width: 110px; }
</style>
</head>
<body>
<button id="showProfileBtn">Show Student Profile</button>
<div id="profileContainer"></div>
<script src="script.js"></script>
</body>
</html>
