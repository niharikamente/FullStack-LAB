<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile Generator</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f2f4f8; }

  .form-card { margin: 0 auto; background: #fff; border-radius: 10px;
               box-shadow: 0 4px 14px rgba(0,0,0,0.12); padding: 25px 35px;
               width: 300px; text-align: left; }
  .form-card h2 { color: #2f6fed; border-bottom: 2px solid #2f6fed; padding-bottom: 8px; margin-top: 0; }
  .form-card label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .form-card input {
    width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; box-sizing: border-box;
  }
  .form-card input:focus { outline: none; border-color: #2f6fed; }

  #showProfileBtn { background: #2f6fed; color: #fff; border: none; padding: 12px 28px;
                     font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; }
  #showProfileBtn:hover { background: #1e54c4; }

  .profile-card { margin: 30px auto 0; background: #fff; border-radius: 10px;
                   box-shadow: 0 4px 14px rgba(0,0,0,0.12); padding: 25px 35px;
                   width: 300px; text-align: left; }
  .profile-card h2 { color: #2f6fed; border-bottom: 2px solid #2f6fed; padding-bottom: 8px; }
  .profile-card span.label { font-weight: 600; display: inline-block; width: 110px; }
</style>
</head>
<body>

<form id="studentForm" class="form-card">
  <h2>Enter Student Details</h2>

  <label for="nameInput">Name</label>
  <input type="text" id="nameInput" required placeholder="e.g. Niharika">

  <label for="rollInput">Roll No</label>
  <input type="text" id="rollInput" required placeholder="e.g. A24126552097">

  <label for="deptInput">Department</label>
  <input type="text" id="deptInput" required placeholder="e.g. CSE (AI & ML)">

  <label for="cgpaInput">CGPA</label>
  <input type="number" id="cgpaInput" step="0.01" min="0" max="10" required placeholder="e.g. 8.88">

  <button type="submit" id="showProfileBtn">Show Student Profile</button>
</form>

<div id="profileContainer"></div>

<script src="script.js"></script>
</body>
</html>
